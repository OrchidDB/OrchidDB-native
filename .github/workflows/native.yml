name: Build native compiler
run-name: native ${{ inputs.request_id }} ${{ inputs.tag }} ${{ inputs.platform }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag to build
        required: true
        type: string
      platform:
        description: Build only this platform; completed platforms are retained
        type: choice
        default: all
        options:
        - all
        - linux-x86_64
        - macos-aarch64
        - macos-x86_64
        - windows-x86_64
      request_id:
        description: Coordinator id for safe resume and dispatch recovery
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: native-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux-x86_64' && '[{"os":"ubuntu-22.04","platform":"linux-x86_64","target":"x86_64-unknown-linux-gnu","library":"liborchiddb_compiler.so"}]'
          || inputs.platform == 'macos-aarch64' && '[{"os":"macos-26","platform":"macos-aarch64","target":"aarch64-apple-darwin","library":"liborchiddb_compiler.dylib"}]'
          || inputs.platform == 'macos-x86_64' && '[{"os":"macos-26-intel","platform":"macos-x86_64","target":"x86_64-apple-darwin","library":"liborchiddb_compiler.dylib"}]'
          || inputs.platform == 'windows-x86_64' && '[{"os":"windows-2022","platform":"windows-x86_64","target":"x86_64-pc-windows-msvc","library":"orchiddb_compiler.dll"}]'
          || '[{"os":"ubuntu-22.04","platform":"linux-x86_64","target":"x86_64-unknown-linux-gnu","library":"liborchiddb_compiler.so"},{"os":"macos-26","platform":"macos-aarch64","target":"aarch64-apple-darwin","library":"liborchiddb_compiler.dylib"},{"os":"macos-26-intel","platform":"macos-x86_64","target":"x86_64-apple-darwin","library":"liborchiddb_compiler.dylib"},{"os":"windows-2022","platform":"windows-x86_64","target":"x86_64-pc-windows-msvc","library":"orchiddb_compiler.dll"}]')
          }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 0
      ORCHIDDB_RELEASE_BUILD: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: orchiddb-native
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        path: orchiddb-native
    - name: Read pinned core
      id: core
      run: echo "revision=$(cat CORE_REVISION)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: OrchidDB/OrchidDB
        ref: ${{ steps.core.outputs.revision }}
        path: orchiddb
    - uses: dtolnay/rust-toolchain@1.93.1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: orchiddb-native
        shared-key: release-native-${{ matrix.platform }}
        cache-on-failure: true
    - name: Build native compiler
      run: |
        cargo build --locked --release
        cargo tree --locked --edges normal --prefix none > target/dependencies.txt
        if grep -E "^(duckdb|libduckdb-sys|postgres|tokio-postgres) " target/dependencies.txt; then exit 1; fi
    - name: Package compiler
      run: python scripts/package.py --library "target/release/${{ matrix.library }}" --target "${{ matrix.target }}" --tag "$RELEASE_TAG"
    - name: Record source revision
      run: git rev-parse HEAD > dist/SOURCE_COMMIT
    - uses: actions/upload-artifact@v4
      with:
        name: compiler-${{ matrix.target }}
        path: orchiddb-native/dist/*
        if-no-files-found: error
        overwrite: true
        retention-days: 30
