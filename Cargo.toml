[package]
name = "orchiddb-compiler-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Database-free OrchidDB SQL compiler C ABI"
repository = "https://github.com/OrchidDB/OrchidDB-native"

[lib]
name = "orchiddb_compiler"
crate-type = ["cdylib", "rlib"]

[dependencies]
orchiddb = { path = "../orchiddb", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev]
debug = 0

# Shipped inside every language package; keep unwinding for the C ABI's catch_unwind.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
